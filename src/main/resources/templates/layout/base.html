<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JBlueSoft es una empresa de tecnología integral especializada en desarrollo de software por sectores, plataformas digitales, educación IT y comercialización de equipamiento y cultura geek.">
    <meta name="keywords" content="JBlueSoft, Desarrollo de Software, plataformas digitales, educación IT, comercialización de equipamiento, cultura geek, Perú, tecnología integral, soluciones a medida, SaaS, formación especializada, equipamiento informático, innovación tecnológica, ciberseguridad, inteligencia artificial, programación, IoT, comercio informático, merchandising geek">
    <meta name="author" content="JBlueSoft">

    <title th:replace="${title}">JBlueSoft</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/icons/icon.svg}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
          integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ"
          crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main th:replace="${content}"></main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
