

# ==========================================
# APPLICATION INFO
# ==========================================
spring.application.name=jbluesoftweb
server.port=8080
#============================================================================
# Cache busting: agrega un hash del contenido al nombre de los recursos estáticos
# (/css/styles.css -> /css/styles-<md5>.css) en todas las URLs generadas con @{...}
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Cache de 1 año para recursos estáticos: es seguro porque el HTML siempre los referencia
# con el hash de su contenido; si un archivo cambia, cambia su URL y el navegador lo pide de nuevo.
# No afecta al HTML de las vistas Thymeleaf, que sigue pudiendo actualizarse.
spring.web.resources.cache.cachecontrol.max-age=365d
#============================================================================

# ==========================================
# DATABASE - PostgreSQL
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==========================================
# PÁGINAS DE ERROR (templates/error/)
# Nunca incluir detalles técnicos en la respuesta de error.
# En Spring Boot 4 son spring.web.error.* (server.error.* ya no tiene efecto)
# ==========================================
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
spring.web.error.include-path=never

